name: cirugias

services:
  api:
    build: .
    image: cirugias-api:1.0
    container_name: cirugias-api
    network_mode: host          # comparte la red del servidor: llega a MariaDB en 127.0.0.1:3306
    env_file: .env
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
