<!DOCTYPE html>
<html lang="es" data-theme="blanco">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iniciar sesión - Hospital Morelos</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/sesion.css">
</head>
<body>
  <main class="login">
    <form class="card login-card" id="fLogin" novalidate>
      <div class="brand"><img src="img/logo.png" alt=""><div>Hospital Morelos<small>Salud con calidez humana</small></div></div>
      <h1>Iniciar sesión</h1>
      <div class="f"><label for="lu">Usuario</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
      <div class="f"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" id="lEntrar">Entrar</button>
    </form>
  </main>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
